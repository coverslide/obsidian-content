name: Obsidian Web checks

on:
  push:
  pull_request:

jobs:
  generator-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install generator build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build python3
      - name: Build console generator
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOBSIDIAN_CONSOLE_ONLY=ON
          cmake --build build --parallel 2
      - name: Smoke-test restored game content
        run: python3 tests/generator_smoke.py ./obsidian

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: web/go.sum
      - name: Run backend tests
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend unit tests
        run: npm run test:unit
      - name: Build frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run test:e2e
