services:
  obsidian-web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    image: obsidian-web:local
    ports:
      - "${OBSIDIAN_WEB_PORT:-8080}:8080"
    environment:
      DATABASE_PATH: /data/jobs.db
      WAD_DIR: /wads
      WEB_DIR: /app/dist
      OBSIDIAN_BIN: /opt/obsidian/obsidian
      OBSIDIAN_HOME: /opt/obsidian
    volumes:
      - obsidian-data:/data
      - obsidian-wads:/wads
      - ./config:/config:ro
    restart: unless-stopped

volumes:
  obsidian-data:
  obsidian-wads:
