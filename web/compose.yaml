services:
  obsidian-web:
    build:
      context: ..
      dockerfile: Dockerfile.web
    image: obsidian-web:local
    ports:
      - "${OBSIDIAN_WEB_PORT:-8080}:8080"
    volumes:
      - obsidian-data:/data
      - obsidian-wads:/wads
      - /mnt/Games/doom-wad/iwad:/opt/uzdoom-player/private:ro
      - ./config:/config:ro
    restart: unless-stopped

volumes:
  obsidian-data:
  obsidian-wads:
